name: VAL-002 Executor

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - research/val002-executor
    paths:
      - "pyproject.toml"
      - "specs/VAL-001.json"
      - "specs/VAL-002.json"
      - "specs/VAL-002.reference.json"
      - "src/memory_attention_lab/attention/value_sources.py"
      - "src/memory_attention_lab/attention/__init__.py"
      - "src/memory_attention_lab/experiments/val002.py"
      - "tests/test_val002.py"
      - "tests/test_val002_reference.py"
      - "docs/VAL-002.md"
      - "README.md"
      - ".github/workflows/val002.yml"
  pull_request:
    paths:
      - "pyproject.toml"
      - "specs/VAL-001.json"
      - "specs/VAL-002.json"
      - "specs/VAL-002.reference.json"
      - "src/memory_attention_lab/attention/value_sources.py"
      - "src/memory_attention_lab/attention/__init__.py"
      - "src/memory_attention_lab/experiments/val002.py"
      - "tests/test_val002.py"
      - "tests/test_val002_reference.py"
      - "docs/VAL-002.md"
      - "README.md"
      - ".github/workflows/val002.yml"

permissions:
  contents: read

jobs:
  test:
    name: test / ${{ matrix.os }} / py${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
        python:
          - "3.12"
          - "3.13"

    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Full test suite
        run: pytest

  evidence:
    name: reference evidence / ubuntu-24.04 / py3.12
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Execute VAL-002
        run: |
          python -m memory_attention_lab.experiments.val002 \
            specs/VAL-002.reference.json \
            --parent-val001 specs/VAL-001.json \
            --out runs/VAL-002/reference

      - name: Publish checks in job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## VAL-002 manifest"
            echo '```json'
            cat runs/VAL-002/reference/manifest.json
            echo '```'
            echo
            echo "## VAL-002 checks"
            echo '```json'
            cat runs/VAL-002/reference/checks.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload structured evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: val002-reference-evidence
          path: runs/VAL-002/reference/
          if-no-files-found: error
          retention-days: 7

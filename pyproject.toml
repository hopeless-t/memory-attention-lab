[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-attention-lab"
version = "0.1.0"
description = "Independent reproducibility and systems research for Memory Attention."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
